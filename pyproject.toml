[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-rl"
version = "0.1.0"
description = "Learn The Binding of Isaac through a synchronous Lua bridge and PPO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "gymnasium>=1.0", "rich>=13", "psutil>=5.9", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "lupa>=2"]

[tool.setuptools.packages.find]
include = ["isaac_rl*"]

[tool.setuptools.package-data]
isaac_rl = ["dashboard_assets/*.html", "dashboard_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
